[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "izvor"
version = "0.9.0"
description = "Multi-agent dialectical discussion orchestration service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.22.0,<1.0.0",
    "litellm>=1.0.0,<2.0.0",
    "slack_sdk>=3.20.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "httpcore>=1.0.5,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "pyyaml>=6.0,<7.0",
    "lancedb>=0.17.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "tantivy>=0.22.0,<1.0.0",
    "markdown-it-py>=3.0.0,<4.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "anyio>=4.0.0,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "downloads",
    "data",
    "deprecated",
    "static_backup",
    "Izvor-app",
    "e2e_testing_harness",
    "scripts",
    ".venv",
    "rag_knowledge",
    "agents_resources",
    "system_resources",
    "flat-histories",
    "audit",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "F401",
    "BLE001",
    "S110",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "S110"]
