[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]

[project]
name = "izvor"
version = "0.10.0"
description = "Multi-agent dialectical discussion orchestration service"
license = "BUSL-1.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.22.0,<1.0.0",
    "litellm>=1.0.0,<2.0.0",
    "slack_sdk>=3.20.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "httpcore>=1.0.5,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "pyyaml>=6.0,<7.0",
    "lancedb>=0.17.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0,<26.0.0",
    "tantivy>=0.22.0,<1.0.0",
    "presidio-analyzer>=2.2.0",
    "spacy>=3.8.0",
    "mcp>=1.2.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "tzdata>=2024.1",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl#sha256=5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "anyio>=4.0.0,<5.0.0",
    "datasets>=3.0.0,<6.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "types-PyYAML>=6.0.12",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]
pythonpath = ["engine", "."]
norecursedirs = [
    "data",
    "config",
    "tests/e2e",
    "tests/evals",
    ".venv",
    "agents_resources",
    "system_resources",
]
markers = [
    "presidio: tests exercising real Presidio/spaCy NER model loading",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["system_resources/agy/auto"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "F401",
    "BLE001",
    "S110",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/**" = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["engine"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["core.*", "orchestration.protocols"]
strict = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "services.*", "agents.*", "pipeline.*"]
follow_imports = "skip"
